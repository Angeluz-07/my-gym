services:
  web_app:
    image: angeluz07/mygym:0.0.1 # use local if exists
    build: # if doesnt, build it
      context: .
      dockerfile: ./deploy/Dockerfile
    container_name: web_app_mg
    ports:
      - "8000:8000"
    #extra_hosts:
    #  - "localhost:host-gateway"
    environment:
      - POSTGRES_URI=${POSTGRES_URI}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=True
    volumes:
      - ./django-app:/app:z
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 0.25G
        reservations:
          cpus: "0.5"
          memory: 0.25G  
    profiles:
      - web_app_mg
 