{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}MyGym App{% endblock %}</title>

    <!-- DaisyUI y Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-base-200 min-h-screen">
    
    <!-- Navbar Global -->
    <div class="navbar bg-base-100 shadow-sm px-4">
      <div class="navbar-start">
        <a href="{% url 'index' %}" class="btn btn-ghost text-xl">💪 MyGym</a>
      </div>
      <div class="navbar-center hidden lg:flex">
        <ul class="menu menu-horizontal px-1">
          <li><a href="{% url 'index' %}">Miembros</a></li>          
          <li><a href="{% url 'member_add' %}">Agregar Miembro</a></li>
        </ul>
      </div>
      <div class="navbar-end">
        <a class="btn btn-primary">Login</a>
      </div>
    </div>

    <!-- Contenido Dinámico Principal -->
    <main class="container mx-auto p-6">
      {% block content %}
      <!-- Aquí se inyectará el contenido de las otras vistas -->
      {% endblock %}
    </main>

  </body>
</html>
